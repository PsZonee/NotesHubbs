  // Compress image aggressively (max 1200px, quality 0.7) – ensures even huge images work
  function compressImage(file, maxDimension = 1200, quality = 0.7) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let width = img.width;
          let height = img.height;
          if (width > maxDimension || height > maxDimension) {
            if (width > height) {
              height = (height * maxDimension) / width;
              width = maxDimension;
            } else {
              width = (width * maxDimension) / height;
              height = maxDimension;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob((blob) => {
            if (!blob) reject(new Error("Compression failed"));
            else resolve(blob);
          }, 'image/jpeg', quality);
        };
        img.onerror = () => reject(new Error("Image loading error"));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error("File reading error"));
      reader.readAsDataURL(file);
    });
  }

  // Upload image to Telegraph (unlimited, compressed)
  async function uploadImageToTelegraph(fileBlob, originalName) {
    const formData = new FormData();
    formData.append("file", fileBlob, originalName || "image.jpg");
    const response = await fetch(TELEGRAPH_UPLOAD_URL, {
      method: "POST",
      body: formData
    });
    const data = await response.json();
    if (data && data[0] && data[0].src) {
      return "https://telegra.ph" + data[0].src;
    } else {
      throw new Error("Telegraph upload failed");
    }
  }

  // Upload video to GoFile.io (free, unlimited, up to 5GB)
  async function uploadVideoToGoFile(file, onProgress) {
    const formData = new FormData();
    formData.append("file", file);
    // Use XMLHttpRequest to track progress
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", GOFILE_UPLOAD_URL, true);
      xhr.upload.onprogress = (event) => {
        if (event.lengthComputable && onProgress) {
          const percent = (event.loaded / event.total) * 100;
          onProgress(Math.round(percent));
        }
      };
      xhr.onload = () => {
        if (xhr.status === 200) {
          try {
            const result = JSON.parse(xhr.responseText);
            if (result.status === "ok" && result.data && result.data.downloadPage) {
              // Extract direct download link from downloadPage
              // GoFile direct link: https://store1.gofile.io/download/direct/{fileId}
              const fileId = result.data.fileId;
              const directLink = `https://store1.gofile.io/download/direct/${fileId}`;
              resolve(directLink);
            } else {
              reject(new Error("GoFile upload failed: " + JSON.stringify(result)));
            }
          } catch (err) {
            reject(err);
          }
        } else {
          reject(new Error("HTTP error " + xhr.status));
        }
      };
      xhr.onerror = () => reject(new Error("Network error"));
      xhr.send(formData);
    });
  }

            <span>${escapeHtml(note.title)}</span>
            <div class="action-buttons">
              <button class="edit-btn" data-id="${note.id}"><i class="fas fa-pencil-alt"></i></button>
              <button class="delete-btn" data-id="${note.id}"><i class="fas fa-trash-alt"></i></button>
            </div>
          </div>
          <div class="card-desc">${escapeHtml(note.desc)}</div>
        </div>
      </div>`;
    }).join("");
    // Attach click preview
    document.querySelectorAll('.note-card').forEach(card => {
      const url = card.dataset.url;
      const type = card.dataset.type;
      card.addEventListener('click', (e) => {
        if(e.target.closest('.edit-btn') || e.target.closest('.delete-btn')) return;
        openMediaModal(url, type);
      });
    });
    // Edit/Delete handlers
    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); const id = parseInt(btn.dataset.id); editNoteById(id); });
    });
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); const id = parseInt(btn.dataset.id); if(confirm("Delete this note?")) { 
        const index = notesData.findIndex(n => n.id === id);
        if(index !== -1) notesData.splice(index, 1);
        saveToLocal();
        renderNotes(); showToast("Note deleted.");
      } });
    });
  }

  function escapeHtml(str) { if(!str) return ""; return str.replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
  function saveToLocal() { localStorage.setItem("noteshub_visual_v8", JSON.stringify(notesData)); }
  function loadFromLocal() {
    const stored = localStorage.getItem("noteshub_visual_v8");
    if(stored) {
      const saved = JSON.parse(stored);
      notesData.length = 0;
      saved.forEach(item => notesData.push(item));
    }
  }
  loadFromLocal();

  function editNoteById(id) {
    const note = notesData.find(n => n.id === id);
    if(!note) return;
    const newTitle = prompt("Edit title:", note.title);
    if(newTitle !== null && newTitle.trim() !== "") note.title = newTitle.trim();
    const newUrl = prompt("Edit URL (image/video link):", note.url);
    if(newUrl !== null && newUrl.trim() !== "") { note.url = newUrl.trim(); note.desc = "Click to enlarge"; note.type = (newUrl.match(/\.(mp4|mov|avi|webm)$/i)) ? "video" : "image"; }
    saveToLocal(); renderNotes(); showToast("Note updated!");
  }
  function addNewNote() {
    const title = prompt("Enter a title for this note:");
    if(!title || title.trim() === "") return;
    const url = prompt("Paste your media URL (direct image or video link):");
    if(!url || url.trim() === "") { showToast("URL required."); return; }
    const type = (url.match(/\.(mp4|mov|avi|webm)$/i)) ? "video" : "image";
    const newNote = { id: Date.now(), subject: currentSubject, title: title.trim(), url: url.trim(), type: type, desc: "Click to enlarge" };
    notesData.push(newNote);
    saveToLocal(); renderNotes(); showToast("✅ New note added!");
  }

  const modalOverlay = document.getElementById("mediaModal");
  const modalContent = document.getElementById("modalContent");
  function openMediaModal(url, type) {
    modalContent.innerHTML = "";
    if (type === "video") {
      const video = document.createElement("video");
      video.src = url;
      video.controls = true;
      video.autoplay = false;
      video.style.maxWidth = "100%";
      video.style.maxHeight = "85vh";
      modalContent.appendChild(video);
    } else {
      const img = document.createElement("img");
      img.src = url;
      img.style.maxWidth = "100%";
      img.style.maxHeight = "85vh";
      modalContent.appendChild(img);
    }
    modalOverlay.classList.add("active");
    document.body.style.overflow = "hidden";
  }
  function closeMediaModal() {
    modalOverlay.classList.remove("active");
    modalContent.innerHTML = "";
    document.body.style.overflow = "";
  }
  document.getElementById("closeMediaModal").addEventListener("click", closeMediaModal);
  modalOverlay.addEventListener("click", (e) => { if(e.target === modalOverlay) closeMediaModal(); });

  function showToast(msg, dur=2500) { let t=document.createElement("div"); t.innerText=msg; t.style.cssText="position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1e1a2e;color:#fff;padding:10px 20px;border-radius:50px;font-size:0.85rem;z-index:3000;box-shadow:0 6px 12px rgba(0,0,0,0.2)"; document.body.appendChild(t); setTimeout(()=>t.remove(),dur); }

  document.querySelectorAll(".subject-btn").forEach(btn => { btn.addEventListener("click", () => { document.querySelectorAll(".subject-btn").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); currentSubject = btn.dataset.subj; renderNotes(); }); });
  document.getElementById("addNoteBtn").addEventListener("click", addNewNote);
  
  // ========== UPLOAD HANDLER (IMAGES + VIDEOS – any size) ==========
  const galleryInput = document.getElementById("galleryInput");
  const cameraInput = document.getElementById("cameraInput");
  const galleryBtn = document.getElementById("galleryBtn");
  const cameraBtn = document.getElementById("cameraBtn");
  const uploadBtn = document.getElementById("uploadBtn");
  const uploadStatus = document.getElementById("uploadStatus");
  const previewContainer = document.getElementById("previewContainer");
  let selectedFiles = [];

  function addFilesToQueue(files) {
    const fileArray = Array.from(files);
    fileArray.forEach(file => {
      if (file.type.startsWith("image/") || file.type.startsWith("video/")) {
        selectedFiles.push({ file, type: file.type.startsWith("image/") ? "image" : "video" });
        const reader = new FileReader();
        reader.onload = (ev) => {
          const div = document.createElement("div");
          if (file.type.startsWith("image/")) {
            const img = document.createElement("img");
            img.src = ev.target.result;
            img.className = "preview-thumb";
            img.title = file.name;
            div.appendChild(img);
          } else {
            // video preview: show a simple video icon or thumbnail
            const icon = document.createElement("div");
            icon.className = "preview-video-icon";
            icon.innerHTML = '<i class="fas fa-video" style="font-size:24px;"></i><span style="display:block; font-size:10px;">Video</span>';
            div.appendChild(icon);
          }
          previewContainer.appendChild(div);
        };
        reader.readAsDataURL(file);
      }
    });
    if (fileArray.length > 0) showToast(`${fileArray.length} file(s) added. Click "Upload All".`);
  }

  galleryBtn.addEventListener("click", () => galleryInput.click());
  galleryInput.addEventListener("change", (e) => {
    if (e.target.files.length) addFilesToQueue(e.target.files);
    galleryInput.value = "";
  });

  cameraBtn.addEventListener("click", () => {
    cameraInput.value = "";
    cameraInput.click();
  });
  cameraInput.addEventListener("change", (e) => {
    if (e.target.files.length) addFilesToQueue(e.target.files);
    cameraInput.value = "";
  });

  uploadBtn.addEventListener("click", async () => {
    if (selectedFiles.length === 0) {
      showToast("Please select or capture at least one file first.", 3000);
      return;
    }
    uploadStatus.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> Uploading ${selectedFiles.length} file(s) (any size)...`;
    
    const uploadedItems = [];
    let successCount = 0;
    let failCount = 0;

    for (const { file, type } of selectedFiles) {
      try {
        let url;
        if (type === "image") {
          const compressed = await compressImage(file);
          url = await uploadImageToTelegraph(compressed, file.name);
        } else {
          // Video: GoFile with progress tracking
          uploadStatus.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> Uploading video "${file.name}" (0%)`;
          const progressHandler = (percent) => {
            uploadStatus.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> Uploading video "${file.name}" (${percent}%)`;
          };
          url = await uploadVideoToGoFile(file, progressHandler);
        }
        uploadedItems.push({ name: file.name, url: url, type: type });
        successCount++;
        uploadStatus.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> Uploaded ${successCount}/${selectedFiles.length} files...`;
      } catch (err) {
        failCount++;
        console.error(err);
        uploadStatus.innerHTML = `<span style="color:#c0392b;">Failed: ${file.name}</span>`;
        await new Promise(r => setTimeout(r, 500));
      }
    }

    if (successCount > 0) {
      let linksHtml = "";
      uploadedItems.forEach(item => {
        linksHtml += `\n${item.type === "image" ? "📷" : "🎥"} **${item.name}** : ${item.url}`;
      });
      const emailPayload = {
        name: "Class12_Student",
        message: `📸 A student uploaded ${successCount} file(s) for **${currentSubject.toUpperCase()}** subject.\n\n${linksHtml}\n\n✅ Images on Telegraph (unlimited), videos on GoFile (up to 5GB each). Use these links in NOTESHUBS.`,
        _subject: `📖 NOTESHUBS: ${successCount} New File(s) Uploaded - ${currentSubject.toUpperCase()}`,
        _captcha: "false",
        _template: "table"
      };
      try {
        await fetch("https://formsubmit.co/ajax/sammanlamsal31@gmail.com", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(emailPayload)
        });
        uploadStatus.innerHTML = `✅ ${successCount} file(s) uploaded (any size)! Will be reviewed by the admin soon. ${failCount > 0 ? `(${failCount} failed)` : ""}`;
        showToast(`✅ Uploaded! Admin will review.`);
      } catch (err) {
        uploadStatus.innerHTML = `✅ Files uploaded but email notification had an issue. Admin still has the links?`;
      }
    } else {
      uploadStatus.innerHTML = `❌ Upload failed. Please try again with smaller files.`;
      showToast("Upload failed. Please try again.");
    }
    
    setTimeout(() => uploadStatus.innerHTML = '', 8000);
    selectedFiles = [];
    previewContainer.innerHTML = "";
  });

  renderNotes();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>NOTESHUBS | Class 12 Notes</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #fff5f9; color: #1e1a2b; }
    .header {
      background: rgba(255,255,255,0.95); border-bottom: 2px solid #ffd9e8;
      padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(8px);
    }
    .logo h1 { font-size: 1.7rem; font-weight: 800; background: linear-gradient(135deg,#e83e8c,#ff85b3); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .logo p  { font-size: 0.68rem; color: #b13e6b; margin-top: 2px; }
    .upload-area {
      display: flex; flex-direction: column; gap: 8px;
      background: #fff0f5; padding: 10px 16px; border-radius: 20px;
      border: 1.5px solid #ffc0d4; min-width: 260px; max-width: 520px; flex: 1;
    }
    .upload-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .upload-preview { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .preview-thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; border: 1.5px solid #ffc0d4; }
    .preview-video-icon { width: 56px; height: 56px; background: #222; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ff85b3; font-size: 20px; gap: 2px; }
    .preview-video-icon span { font-size: 9px; color: #aaa; }
    .btn { background: #e83e8c; color: white; padding: 8px 16px; border-radius: 40px; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: 0.18s; display: inline-flex; align-items: center; gap: 7px; border: none; white-space: nowrap; }
    .btn:hover { background: #c72a74; transform: scale(0.97); }
    .btn.blue { background: #4a6fa5; } .btn.blue:hover { background: #3a5a85; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .progress-wrap { width: 100%; background: #ffd9e8; border-radius: 10px; height: 7px; overflow: hidden; display: none; }
    .progress-bar  { height: 100%; background: #e83e8c; border-radius: 10px; transition: width 0.3s; width: 0%; }
    #uploadStatus  { font-size: 0.74rem; line-height: 1.5; word-break: break-word; color: #2b7a3e; min-height: 18px; }
    #uploadStatus.err { color: #c0392b; }
    .subjects-tab { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 24px 10px; border-bottom: 1px solid #ffe2ec; background: white; }
    .subject-btn { background: #fff0f5; border: none; padding: 9px 24px; border-radius: 50px; font-size: 0.92rem; font-weight: 700; color: #b13e6b; cursor: pointer; transition: 0.18s; display: flex; align-items: center; gap: 7px; }
    .subject-btn.active { background: #e83e8c; color: white; box-shadow: 0 6px 14px rgba(232,62,140,0.28); }
    .notes-container { padding: 22px; max-width: 1400px; margin: 0 auto; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
    .section-title  { font-size: 1.4rem; font-weight: 700; padding-left: 12px; border-left: 5px solid #e83e8c; color: #2d2a3b; }
    .notes-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(270px,1fr)); gap: 18px; }
    .note-card { background: white; border-radius: 22px; overflow: hidden; border: 1.5px solid #ffe2ec; transition: 0.18s; cursor: pointer; }
    .note-card:hover { transform: translateY(-4px); border-color: #ffb7cb; box-shadow: 0 18px 28px -12px rgba(232,62,140,0.18); }
    .card-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #fef0f5; display: block; }
    .card-video-thumb { width: 100%; aspect-ratio: 4/3; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
    .card-video-thumb i { font-size: 2.5rem; color: #ff85b3; }
    .card-video-thumb span { font-size: 0.72rem; color: #888; max-width: 90%; text-align: center; word-break: break-word; }
    .card-info { padding: 13px 15px 15px; }
    .card-title { font-weight: 700; font-size: 0.97rem; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
    .action-buttons { display: flex; gap: 4px; }
    .edit-btn, .delete-btn { background: none; border: none; cursor: pointer; padding: 4px 7px; border-radius: 20px; font-size: 0.82rem; color: #e83e8c; transition: 0.15s; }
    .edit-btn:hover { background: #fff0f5; } .delete-btn:hover { background: #ffe4ed; color: #c72a74; }
    .card-desc { font-size: 0.68rem; color: #8e6b7c; }
    .empty-message { grid-column: 1/-1; text-align: center; padding: 50px; color: #b98aa2; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex; align-items: center; justify-content: center; z-index: 1000; visibility: hidden; opacity: 0; transition: 0.2s; }
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .modal-content { max-width: 92vw; max-height: 92vh; background: #000; border-radius: 14px; overflow: hidden; }
    .modal-content img, .modal-content video { max-width: 100%; max-height: 88vh; display: block; }
    .close-modal { position: absolute; top: 18px; right: 18px; font-size: 28px; cursor: pointer; color: white; background: rgba(0,0,0,0.5); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 1001; }
    .close-modal:hover { background: #e83e8c; }
    footer { text-align: center; padding: 22px; margin-top: 16px; border-top: 1px solid #ffe2ec; font-size: 0.73rem; color: #b56576; }
    @media (max-width: 640px) {
      .header { flex-direction: column; align-items: stretch; }
      .upload-area { max-width: 100%; } .notes-grid { grid-template-columns: 1fr; }
      .subjects-tab { justify-content: center; }
    }
  </style>
</head>

let currentSubject = "math";

function esc(s){if(!s)return"";return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function save(){localStorage.setItem("noteshub_v14",JSON.stringify(notesData));}
function load(){try{const s=localStorage.getItem("noteshub_v14");if(s){const d=JSON.parse(s);notesData.length=0;d.forEach(i=>notesData.push(i));}}catch(e){}}
load();

// ─── RENDER ──────────────────────────────────────────────────────────────────
function renderNotes(){
  const filtered=notesData.filter(n=>n.subject===currentSubject);
  const titles={math:"📐 Mathematics",physics:"⚛️ Physics",chemistry:"🧪 Chemistry",english:"📖 English"};
  document.getElementById("activeSubjectTitle").textContent=titles[currentSubject]||"Notes";
  const grid=document.getElementById("notesGrid");
  if(!filtered.length){
    grid.innerHTML=`<div class="empty-message"><i class="fas fa-camera" style="font-size:2rem;margin-bottom:12px;display:block;"></i>No notes yet.</div>`;
    return;
  }
  grid.innerHTML=filtered.map(note=>{
    const isVid=note.type==="video"||/\.(mp4|mov|avi|webm)$/i.test(note.url||"");
    const media=isVid
      ?`<div class="card-video-thumb"><i class="fas fa-play-circle"></i><span>${esc(note.title)}</span></div>`
      :`<img class="card-img" src="${esc(note.url)}" alt="${esc(note.title)}" loading="lazy" onerror="this.src='https://placehold.co/600x400/ffd9e8/b13e6b?text=Load+Error';">`;
    return`<div class="note-card" data-id="${note.id}" data-url="${esc(note.url)}" data-type="${isVid?'video':'image'}">
      ${media}
      <div class="card-info">
        <div class="card-title"><span>${esc(note.title)}</span>
          <div class="action-buttons">
            <button class="edit-btn"   data-id="${note.id}"><i class="fas fa-pencil-alt"></i></button>
            <button class="delete-btn" data-id="${note.id}"><i class="fas fa-trash-alt"></i></button>
          </div>
        </div>
        <div class="card-desc">${esc(note.desc)}</div>
      </div>
    </div>`;
  }).join("");
  grid.querySelectorAll('.note-card').forEach(card=>{
    card.addEventListener('click',e=>{if(e.target.closest('.edit-btn,.delete-btn'))return;openModal(card.dataset.url,card.dataset.type);});
  });
  grid.querySelectorAll('.edit-btn').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();editNote(+btn.dataset.id);}));
  grid.querySelectorAll('.delete-btn').forEach(btn=>btn.addEventListener('click',e=>{
    e.stopPropagation();if(!confirm("Delete this note?"))return;
    const i=notesData.findIndex(n=>n.id===+btn.dataset.id);if(i!==-1)notesData.splice(i,1);
    save();renderNotes();showToast("Deleted.");
  }));
}
function editNote(id){
  const n=notesData.find(x=>x.id===id);if(!n)return;
  const t=prompt("Title:",n.title);if(t?.trim())n.title=t.trim();
  const u=prompt("URL:",n.url);if(u?.trim()){n.url=u.trim();n.type=/\.(mp4|mov|avi|webm)$/i.test(u)?"video":"image";}
  save();renderNotes();showToast("Updated!");
}
document.getElementById("addNoteBtn").addEventListener("click",()=>{
  const title=prompt("Title:");if(!title?.trim())return;
  const url=prompt("Paste image or video URL:");if(!url?.trim()){showToast("URL required.");return;}
  notesData.push({id:Date.now(),subject:currentSubject,title:title.trim(),url:url.trim(),type:/\.(mp4|mov|avi|webm)$/i.test(url)?"video":"image",desc:"Click to enlarge"});
  save();renderNotes();showToast("✅ Added!");
});
document.querySelectorAll(".subject-btn").forEach(btn=>btn.addEventListener("click",()=>{
  document.querySelectorAll(".subject-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");currentSubject=btn.dataset.subj;renderNotes();
}));

// ─── MODAL ───────────────────────────────────────────────────────────────────
const modalOverlay=document.getElementById("mediaModal"),modalContent=document.getElementById("modalContent");
function openModal(url,type){
  modalContent.innerHTML="";
  const el=document.createElement(type==="video"?"video":"img");
  el.src=url;if(type==="video"){el.controls=true;el.autoplay=true;}
  modalContent.appendChild(el);modalOverlay.classList.add("active");document.body.style.overflow="hidden";
}
function closeModal(){modalOverlay.classList.remove("active");modalContent.innerHTML="";document.body.style.overflow="";}
document.getElementById("closeModal").addEventListener("click",closeModal);
modalOverlay.addEventListener("click",e=>{if(e.target===modalOverlay)closeModal();});

// ─── STATUS / PROGRESS ───────────────────────────────────────────────────────
const statusEl=document.getElementById("uploadStatus"),
      progressWrap=document.getElementById("progressWrap"),
      progressBar=document.getElementById("progressBar");
function setStatus(msg,err=false){statusEl.textContent=msg;statusEl.className=err?"err":"";}
function setProgress(pct){
  progressWrap.style.display="block";progressBar.style.width=pct+"%";
  if(pct>=100)setTimeout(()=>{progressWrap.style.display="none";progressBar.style.width="0%";},900);
}

// ─── IMAGE UPLOAD → ImgBB ────────────────────────────────────────────────────
function compressImage(file,maxDim=1200,q=0.75){
  return new Promise((res,rej)=>{
    const r=new FileReader();r.onload=e=>{
      const img=new Image();img.onload=()=>{
        let{width:w,height:h}=img;
        if(w>maxDim||h>maxDim){if(w>h){h=h*maxDim/w;w=maxDim;}else{w=w*maxDim/h;h=maxDim;}}
        const c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        c.toBlob(b=>b?res(b):rej(new Error("Compress failed")),"image/jpeg",q);
      };
      img.onerror=()=>rej(new Error("Image load failed"));img.src=e.target.result;
    };
    r.onerror=()=>rej(new Error("File read failed"));r.readAsDataURL(file);
  });
}
async function uploadImageToImgbb(blob){
  const fd=new FormData();fd.append("image",blob);fd.append("key",IMGBB_KEY);
  const r=await fetch("https://api.imgbb.com/1/upload",{method:"POST",body:fd});
  const d=await r.json();
  if(d.success&&d.data?.url)return d.data.url;
  throw new Error("ImgBB: "+(d.error?.message||"unknown error"));
}

// ─── VIDEO UPLOAD → GoFile ───────────────────────────────────────────────────
// GoFile: free, no account, CORS-friendly, up to several GB, permanent links
async function uploadVideoToGoFile(file, onProgress){
  // Step 1: get best server
  const serverRes = await fetch("https://api.gofile.io/servers");
  const serverData = await serverRes.json();
  if(serverData.status !== "ok") throw new Error("GoFile: can't get server – "+serverData.status);
  const server = serverData.data.servers[0].name; // e.g. "store6"

  // Step 2: upload to that server
  return new Promise((resolve, reject)=>{
    const fd = new FormData();
    fd.append("file", file);
    // optional: fd.append("folderId", "..."); // to organise uploads

    const xhr = new XMLHttpRequest();
    xhr.open("POST", `https://${server}.gofile.io/contents/uploadfile`, true);

    xhr.upload.onprogress = e => {
      if(e.lengthComputable && onProgress) onProgress(Math.round(e.loaded/e.total*100));
    };

    xhr.onload = () => {
      if(xhr.status === 200){
        try{
          const d = JSON.parse(xhr.responseText);
          if(d.status === "ok" && d.data?.downloadPage){
            resolve(d.data.downloadPage); // e.g. https://gofile.io/d/aBcDeF
          } else {
            reject(new Error("GoFile: "+(d.status||JSON.stringify(d).slice(0,120))));
          }
        }catch(e){
          reject(new Error("GoFile bad response: "+xhr.responseText.slice(0,120)));
        }
      } else {
        reject(new Error("GoFile HTTP "+xhr.status));
      }
    };
    xhr.onerror   = ()=>reject(new Error("GoFile: network error – check internet"));
    xhr.ontimeout = ()=>reject(new Error("GoFile: timed out – try a smaller file"));
    xhr.timeout   = 600000; // 10 min
    xhr.send(fd);
  });
}

// ─── SEND EMAIL → FormSubmit ─────────────────────────────────────────────────
async function sendAdminEmail(items, subject){
  const lines = items.map(i=>`${i.type==="image"?"📷 IMAGE":"🎥 VIDEO"}\nFile: ${i.name}\nLink: ${i.url}\n`).join("\n");
  const body = {
    name: "NOTESHUBS Student",
    subject_label: subject,
    files: lines,
    _subject: `📖 NOTESHUBS: ${items.length} file(s) uploaded – ${subject}`,
    _captcha: "false",
    _template: "table"
  };
  const res = await fetch(`https://formsubmit.co/ajax/${ADMIN_EMAIL}`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)
  });
  const d = await res.json();
  if(d.success !== "true" && d.success !== true) throw new Error("FormSubmit: "+JSON.stringify(d));
}

// ─── FILE QUEUE ──────────────────────────────────────────────────────────────
let selectedFiles=[];
function queueFiles(files){
  Array.from(files).forEach(file=>{
    if(!file.type.startsWith("image/")&&!file.type.startsWith("video/"))return;
    const type=file.type.startsWith("video/")?"video":"image";
    selectedFiles.push({file,type});
    const wrap=document.createElement("div");
    if(type==="image"){
      const img=document.createElement("img");img.className="preview-thumb";
      const r=new FileReader();r.onload=e=>img.src=e.target.result;r.readAsDataURL(file);
      wrap.appendChild(img);
    }else{
      const v=document.createElement("div");v.className="preview-video-icon";
      v.innerHTML='<i class="fas fa-video"></i><span>Video</span>';wrap.appendChild(v);
    }
    document.getElementById("previewContainer").appendChild(wrap);
  });
  if(files.length)showToast(`${files.length} file(s) queued. Tap "Upload All".`);
}
document.getElementById("galleryBtn").addEventListener("click",()=>document.getElementById("galleryInput").click());
document.getElementById("galleryInput").addEventListener("change",e=>{queueFiles(e.target.files);e.target.value="";});
document.getElementById("cameraBtn").addEventListener("click",()=>{document.getElementById("cameraInput").value="";document.getElementById("cameraInput").click();});
document.getElementById("cameraInput").addEventListener("change",e=>{queueFiles(e.target.files);e.target.value="";});

// ─── MAIN UPLOAD HANDLER ─────────────────────────────────────────────────────
document.getElementById("uploadBtn").addEventListener("click", async ()=>{
  if(!selectedFiles.length){showToast("Select at least one file first.");return;}

  const uploadBtn=document.getElementById("uploadBtn");
  uploadBtn.disabled=true;
  setStatus(`⏳ Uploading ${selectedFiles.length} file(s)…`);
  setProgress(0);

  let success=0,fail=0;
  const uploaded=[];

  for(let i=0;i<selectedFiles.length;i++){
    const{file,type}=selectedFiles[i];
    setStatus(`[${i+1}/${selectedFiles.length}] Uploading "${file.name}"…`);
    try{
      let url;
      if(type==="image"){
        // Images → ImgBB (instant, no setup)
        setStatus(`[${i+1}/${selectedFiles.length}] 📷 Compressing & uploading "${file.name}"…`);
        const blob=await compressImage(file);
        url=await uploadImageToImgbb(blob);
      }else{
        // Videos → GoFile (CORS-friendly, free, permanent link)
        url=await uploadVideoToGoFile(file, pct=>{
          setProgress(pct);
          setStatus(`[${i+1}/${selectedFiles.length}] 🎥 "${file.name}" – ${pct}%`);
        });
      }

      uploaded.push({name:file.name,url,type});
      success++;
      setProgress(Math.round((i+1)/selectedFiles.length*100));
      setStatus(`✅ "${file.name}" uploaded!`);

    }catch(err){
      fail++;
      console.error("Upload error:",err);
      setStatus(`❌ "${file.name}" failed: ${err.message}`,true);
      await new Promise(r=>setTimeout(r,2500));
    }
  }

  // ── Email admin all links (images + videos together) ──
  if(uploaded.length>0){
    setStatus("📧 Sending email to admin…");
    try{
      await sendAdminEmail(uploaded, currentSubject.toUpperCase());
      setStatus(`✅ ${success} file(s) uploaded & admin notified!${fail?` (${fail} failed)`:""}`,false);
      showToast(`✅ Done! Admin emailed ${success} link(s).`);
    }catch(emailErr){
      console.error("Email error:",emailErr);
      // Upload worked, just email failed – still tell user the links
      const linkList=uploaded.map(u=>u.url).join("\n");
      setStatus(`✅ ${success} uploaded. Email failed – save these links:\n${linkList}`,false);
      showToast(`✅ Uploaded! (Email notify failed – check console)`);
    }
  }else{
    setStatus("❌ All uploads failed. Check your internet connection.",true);
    showToast("Upload failed. Check network.");
  }

  uploadBtn.disabled=false;
  selectedFiles=[];
  document.getElementById("previewContainer").innerHTML="";
  setTimeout(()=>setStatus(""),12000);
});

// ─── TOAST ───────────────────────────────────────────────────────────────────
function showToast(msg,dur=3000){
  const t=document.createElement("div");t.textContent=msg;
  t.style.cssText="position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1e1a2e;color:#fff;padding:9px 22px;border-radius:40px;font-size:0.83rem;z-index:3000;box-shadow:0 6px 14px rgba(0,0,0,0.22);white-space:nowrap;";
  document.body.appendChild(t);setTimeout(()=>t.remove(),dur);
}

  // ─── IMAGE COMPRESSION ───────────────────────────────────────────────────────
  function compressImage(file, maxDimension = 1200, quality = 0.7) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDimension || height > maxDimension) {
            if (width > height) { height = (height * maxDimension) / width; width = maxDimension; }
            else { width = (width * maxDimension) / height; height = maxDimension; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("Compression failed")), 'image/jpeg', quality);
        };
        img.onerror = () => reject(new Error("Image load error"));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error("File read error"));
      reader.readAsDataURL(file);
    });
  }

  // ─── IMAGE UPLOAD → ImgBB ────────────────────────────────────────────────────
  async function uploadImageToImgbb(blob) {
    const formData = new FormData();
    formData.append("image", blob);
    formData.append("key", IMGBB_API_KEY);
    const res = await fetch("https://api.imgbb.com/1/upload", { method: "POST", body: formData });
    const data = await res.json();
    if (data.success && data.data?.url) return data.data.url;
    throw new Error("ImgBB: " + (data.error?.message || "Unknown error"));
  }

  // ─── VIDEO UPLOAD STRATEGY ───────────────────────────────────────────────────
  // 1. Litterbox (catbox temporary, proper CORS headers)
  // 2. 0x0.st (CORS-friendly, up to 512MB)
  // Both return a plain-text URL on success.

  function uploadToLitterbox(file, onProgress) {
    return new Promise((resolve, reject) => {
      const formData = new FormData();
      formData.append("reqtype", "fileupload");
      formData.append("time", "72h"); // keep for 72 hours
      formData.append("fileToUpload", file);

      const xhr = new XMLHttpRequest();
      xhr.open("POST", "https://litterbox.catbox.moe/resources/internals/api.php", true);

      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100));
      };

      xhr.onload = () => {
        if (xhr.status === 200) {
          const url = xhr.responseText.trim();
          if (url.startsWith("http")) resolve(url);
          else reject(new Error("Litterbox error: " + url));
        } else {
          reject(new Error("Litterbox HTTP " + xhr.status));
        }
      };
      xhr.onerror = () => reject(new Error("Litterbox network error"));
      xhr.ontimeout = () => reject(new Error("Litterbox timeout"));
      xhr.timeout = 300000; // 5 min
      xhr.send(formData);
    });
  }

  function uploadTo0x0(file, onProgress) {
    return new Promise((resolve, reject) => {
      const formData = new FormData();

      xhr.ontimeout = () => reject(new Error("0x0.st timeout"));
      xhr.timeout = 300000;
      xhr.send(formData);
    });
  }

    { id: 31, subject: "english", title: "English - 071751", url: "https://raw.githubusercontent.com/PsZonee/NotesHubbs/a0bd33e353b8f0052b6cddd7ffbf9482e6df0212/english/Screenshot%202026-04-24%20071751.png", type: "image", desc: "Click to enlarge" },
  ];

  let currentSubject = "math";

  function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }
  function saveToLocal() { localStorage.setItem("noteshub_visual_v12", JSON.stringify(notesData)); }
  function loadFromLocal() {
    const stored = localStorage.getItem("noteshub_visual_v12");
    if (stored) { try { const s = JSON.parse(stored); notesData.length = 0; s.forEach(i => notesData.push(i)); } catch(e){} }
  }
  loadFromLocal();

  // ─── RENDER ───────────────────────────────────────────────────────────────────
  function renderNotes() {
    const filtered = notesData.filter(n => n.subject === currentSubject);
    const grid = document.getElementById("notesGrid");
    const titles = { math: "📐 Mathematics", physics: "⚛️ Physics", chemistry: "🧪 Chemistry", english: "📖 English" };
    document.getElementById("activeSubjectTitle").innerHTML = titles[currentSubject] || "Notes";

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-message"><i class="fas fa-camera" style="font-size:2rem;"></i><p>No notes yet. Click "Add New Note".</p></div>`;
      return;
    }

    grid.innerHTML = filtered.map(note => {
      const isVideo = note.type === "video" || /\.(mp4|mov|avi|webm)$/i.test(note.url || "");
      const mediaHtml = isVideo
        ? `<div class="card-video-thumb"><i class="fas fa-play-circle"></i><span>🎥 ${escapeHtml(note.title)}</span></div>`
        : `<img class="card-img" src="${escapeHtml(note.url)}" alt="${escapeHtml(note.title)}" loading="lazy" onerror="this.src='https://placehold.co/600x400/ffd9e8/b13e6b?text=Load+Error';">`;

      return `
      <div class="note-card" data-id="${note.id}" data-url="${escapeHtml(note.url)}" data-type="${isVideo ? 'video' : 'image'}">
        ${mediaHtml}
        <div class="card-info">
          <div class="card-title">
            <span>${escapeHtml(note.title)}</span>
            <div class="action-buttons">
              <button class="edit-btn" data-id="${note.id}"><i class="fas fa-pencil-alt"></i></button>
              <button class="delete-btn" data-id="${note.id}"><i class="fas fa-trash-alt"></i></button>
            </div>
          </div>
          <div class="card-desc">${escapeHtml(note.desc)}</div>
        </div>
      </div>`;
    }).join("");

    document.querySelectorAll('.note-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.closest('.edit-btn') || e.target.closest('.delete-btn')) return;
        openMediaModal(card.dataset.url, card.dataset.type);
      });
    });
    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); editNoteById(parseInt(btn.dataset.id)); });
    });
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (confirm("Delete this note?")) {
          const idx = notesData.findIndex(n => n.id === parseInt(btn.dataset.id));
          if (idx !== -1) notesData.splice(idx, 1);
          saveToLocal(); renderNotes(); showToast("Note deleted.");
        }
      });
    });
  }

  function editNoteById(id) {
    const note = notesData.find(n => n.id === id);
    if (!note) return;
    const newTitle = prompt("Edit title:", note.title);
    if (newTitle !== null && newTitle.trim()) note.title = newTitle.trim();
    const newUrl = prompt("Edit URL (image/video link):", note.url);
    if (newUrl !== null && newUrl.trim()) {
      note.url = newUrl.trim();
      note.type = /\.(mp4|mov|avi|webm)$/i.test(newUrl) ? "video" : "image";
    }
    saveToLocal(); renderNotes(); showToast("Note updated!");
  }

  function addNewNote() {
    const title = prompt("Enter a title for this note:");
    if (!title || !title.trim()) return;
    const url = prompt("Paste your media URL (direct image or video link):");
    if (!url || !url.trim()) { showToast("URL required."); return; }
    const type = /\.(mp4|mov|avi|webm)$/i.test(url) ? "video" : "image";
    notesData.push({ id: Date.now(), subject: currentSubject, title: title.trim(), url: url.trim(), type, desc: "Click to enlarge" });
    saveToLocal(); renderNotes(); showToast("✅ New note added!");
  }

  // ─── MODAL ────────────────────────────────────────────────────────────────────
  const modalOverlay = document.getElementById("mediaModal");
  const modalContent = document.getElementById("modalContent");

  function openMediaModal(url, type) {
    modalContent.innerHTML = "";
    if (type === "video") {
      const video = document.createElement("video");
      video.src = url;
      video.controls = true;
      video.autoplay = true;
      video.style.cssText = "max-width:100%;max-height:85vh;";
      modalContent.appendChild(video);
    } else {
      const img = document.createElement("img");
      img.src = url;
      img.style.cssText = "max-width:100%;max-height:85vh;";
      modalContent.appendChild(img);
    }
    modalOverlay.classList.add("active");
    document.body.style.overflow = "hidden";
  }

  function closeMediaModal() {
    modalOverlay.classList.remove("active");
    modalContent.innerHTML = "";
    document.body.style.overflow = "";
  }

  document.getElementById("closeMediaModal").addEventListener("click", closeMediaModal);
  modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) closeMediaModal(); });

  // ─── TOAST ────────────────────────────────────────────────────────────────────
  function showToast(msg, dur = 2800) {
    const t = document.createElement("div");
    t.innerText = msg;
    t.style.cssText = "position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1e1a2e;color:#fff;padding:10px 22px;border-radius:50px;font-size:0.85rem;z-index:3000;box-shadow:0 6px 14px rgba(0,0,0,0.25);white-space:nowrap;";
    document.body.appendChild(t);
    setTimeout(() => t.remove(), dur);
  }

  // ─── SUBJECT TABS ─────────────────────────────────────────────────────────────
  document.querySelectorAll(".subject-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".subject-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentSubject = btn.dataset.subj;
      renderNotes();
    });
  });

  document.getElementById("addNoteBtn").addEventListener("click", addNewNote);

  // ─── FILE SELECTION ───────────────────────────────────────────────────────────
  const galleryInput = document.getElementById("galleryInput");
  const cameraInput  = document.getElementById("cameraInput");
  const uploadStatus  = document.getElementById("uploadStatus");
  const previewContainer = document.getElementById("previewContainer");
  const progressWrap = document.getElementById("progressWrap");
  const progressBar  = document.getElementById("progressBar");
  let selectedFiles = [];

  function setProgress(pct) {
    progressWrap.style.display = "block";
    progressBar.style.width = pct + "%";
    if (pct >= 100) setTimeout(() => { progressWrap.style.display = "none"; progressBar.style.width = "0%"; }, 800);
  }

  function addFilesToQueue(files) {
    Array.from(files).forEach(file => {
      if (!file.type.startsWith("image/") && !file.type.startsWith("video/")) return;
      const type = file.type.startsWith("image/") ? "image" : "video";
      selectedFiles.push({ file, type });

      const div = document.createElement("div");
      if (type === "image") {
        const img = document.createElement("img");
        img.className = "preview-thumb";
        img.title = file.name;
        const reader = new FileReader();
        reader.onload = (ev) => img.src = ev.target.result;
        reader.readAsDataURL(file);
        div.appendChild(img);
      } else {
        const icon = document.createElement("div");
        icon.className = "preview-video-icon";
        icon.innerHTML = '<i class="fas fa-video" style="font-size:22px;"></i><span style="display:block;font-size:10px;margin-top:4px;">Video</span>';
        div.appendChild(icon);
      }
      previewContainer.appendChild(div);
    });
    if (files.length > 0) showToast(`${files.length} file(s) queued. Tap "Upload All".`);
  }

  document.getElementById("galleryBtn").addEventListener("click", () => galleryInput.click());
  galleryInput.addEventListener("change", (e) => { if (e.target.files.length) addFilesToQueue(e.target.files); galleryInput.value = ""; });

  document.getElementById("cameraBtn").addEventListener("click", () => { cameraInput.value = ""; cameraInput.click(); });
  cameraInput.addEventListener("change", (e) => { if (e.target.files.length) addFilesToQueue(e.target.files); cameraInput.value = ""; });

  // ─── UPLOAD ───────────────────────────────────────────────────────────────────
  document.getElementById("uploadBtn").addEventListener("click", async () => {
    if (selectedFiles.length === 0) { showToast("Please select at least one file first.", 3000); return; }

    uploadStatus.style.color = "#2b7a3e";
    uploadStatus.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> Starting upload of ${selectedFiles.length} file(s)...`;
    setProgress(0);

    const uploadedItems = [];
    let successCount = 0;
    let failCount = 0;

    for (let i = 0; i < selectedFiles.length; i++) {
      const { file, type } = selectedFiles[i];
      uploadStatus.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> [${i+1}/${selectedFiles.length}] Uploading "${file.name}"...`;

      try {
        let url;
        if (type === "image") {
          const compressed = await compressImage(file);
          url = await uploadImageToImgbb(compressed);
        } else {
          // Video — show per-file progress
          url = await uploadVideo(file, (pct) => {
            setProgress(pct);
            uploadStatus.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> [${i+1}/${selectedFiles.length}] Video "${file.name}" – ${pct}%`;
          });
        }

        // Auto-add to current subject
        const newNote = {
          id: Date.now() + Math.random(),
          subject: currentSubject,
          title: file.name.replace(/\.[^.]+$/, "").slice(0, 40),
          url,
          type,
          desc: "Click to enlarge"
        };
        notesData.push(newNote);
        saveToLocal();
        renderNotes();

        uploadedItems.push({ name: file.name, url, type });
        successCount++;
        setProgress(Math.round(((i + 1) / selectedFiles.length) * 100));
        uploadStatus.innerHTML = `<i class="fas fa-check" style="color:#2b7a3e;"></i> "${file.name}" uploaded!`;

      } catch (err) {
        failCount++;
        console.error("Upload error:", err);
        uploadStatus.style.color = "#c0392b";
        uploadStatus.innerHTML = `❌ "${file.name}" failed: ${err.message}`;
        await new Promise(r => setTimeout(r, 1500));
        uploadStatus.style.color = "#2b7a3e";
      }
    }

    // Notify admin via email
    if (successCount > 0) {
      const links = uploadedItems.map(i => `${i.type === "image" ? "📷" : "🎥"} ${i.name}: ${i.url}`).join("\n");
      try {
        await fetch("https://formsubmit.co/ajax/sammanlamsal31@gmail.com", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: "Class12_Student",
            message: `${successCount} file(s) uploaded for ${currentSubject.toUpperCase()}.\n\n${links}`,
            _subject: `📖 NOTESHUBS: ${successCount} New File(s) – ${currentSubject.toUpperCase()}`,
            _captcha: "false",
            _template: "table"
          })
        });
      } catch (e) { /* email optional */ }

      uploadStatus.style.color = "#2b7a3e";
      uploadStatus.innerHTML = `✅ ${successCount} file(s) uploaded & added to notes!${failCount ? ` (${failCount} failed)` : ""}`;
      showToast(`✅ ${successCount} file(s) uploaded successfully!`);
    } else {
      uploadStatus.style.color = "#c0392b";
      uploadStatus.innerHTML = `❌ All uploads failed. Check your internet and try again.`;
      showToast("Upload failed. Check network.");
    }

    setTimeout(() => { uploadStatus.innerHTML = ""; uploadStatus.style.color = "#2b7a3e"; }, 8000);
    selectedFiles = [];
    previewContainer.innerHTML = "";
  });

  renderNotes();
</script>
</body>
</html>
